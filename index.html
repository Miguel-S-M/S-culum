  if($("ks").dataset.h!==kh){$("ks").innerHTML=kh;$("ks").dataset.h=kh;}
  var ev=$("ev");
  if(S.over)ev.innerHTML='<div class="ev"><h2>'+S.over[0]+'</h2><p>'+S.over[1]+'</p>'+(hrs().length?'<p>Continue o legado como:</p>'+hrs().map(function(h){return'<button class="btn alt" onclick="succ('+h.p.id+')">'+h.p.n+' ('+h.t+', '+h.p.age+' anos)</button>';}).join(""):'<p>Não há herdeiros adultos. Use Novo personagem para recomeçar.</p>')+'</div>';
  else if(S.cb)ev.innerHTML=cbHtml();else if(pend)ev.innerHTML='<div class="ev"><h2>'+pend.x+'</h2><p>'+pend.d+'</p>'+pend.o.map(function(o,i){return'<button class="btn alt" onclick="choose('+i+')">'+o.l+'</button>';}).join("")+'</div>';
  else ev.innerHTML="";
  $("go").disabled=!!(pend||S.over||S.cb);renderActs();renderEco();renderTq();
}
function save(v){try{if(!pend&&!S.cb){localStorage.setItem(KEY,JSON.stringify(S));if(v)msg("");}else if(v)msg("Resolva o evento antes de salvar.");}catch(e){if(v)msg("Não foi possível salvar neste navegador. Use Exportar.");}}
function exp(){$("bk").value=JSON.stringify(S);$("bk").select();}
function imp(){try{var o=JSON.parse($("bk").value);if(!o||!o.me||!o.npcs||o.v!==2)throw 1;S=o;pend=null;msg("");draw();}catch(e){msg("Save inválido. Cole o texto exportado completo.");}}
function nw(){var b=$("nw");if(!nwc){nwc=1;b.textContent="Confirmar: apaga o atual";return;}nwc=0;b.textContent="Novo personagem";pend=null;newGame();save();draw();}
function auto(){var b=$("auto");if(timer){clearInterval(timer);timer=null;b.textContent="Tempo automático: desligado";}else{b.textContent="Tempo automático: ligado";timer=setInterval(function(){if(!pend&&!S.over&&!S.cb){var c=$("act").value;if(c==="soc"||c==="help"){if(!S.sel)return;}step();}},1500);}}
(function(){var ok=0;try{var raw=localStorage.getItem(KEY);if(raw){var o=JSON.parse(raw);if(o&&o.me&&o.npcs){S=o;ok=1;}}}catch(e){}$("bz").innerHTML=Object.keys(BZ).map(function(k){return'<option value="'+k+'">'+k+' (custo '+BZ[k].c+(BZ[k].q?', exige '+TG[BZ[k].q]:'')+')</option>';}).join("");initActs();if(!ok)newGame();draw();})();
</script>
</body>
</html>
